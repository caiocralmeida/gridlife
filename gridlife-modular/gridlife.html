<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIDLIFE</title>
<style>
:root{--bg:#09090c;--c:#14141a;--l:#272732;--r:#e11d48;--t:#ececf2;--m:#8d8da0;--g:#22c55e}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(circle at 90% 0,#2a0710,var(--bg) 45%);color:var(--t);font:15px/1.45 'Segoe UI',Arial,sans-serif;padding:10px;min-height:100vh}
h1,h2,h3{font-family:Impact,'Arial Narrow Bold',sans-serif;letter-spacing:.5px;font-weight:400}
#app{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:2px solid var(--r);padding-bottom:8px;margin-bottom:10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
button{font:inherit;cursor:pointer}.b,nav button{background:var(--r);color:#fff;border:0;padding:10px 14px;border-radius:6px;font-weight:700;font-size:.85rem}
nav button{background:var(--c);color:var(--m);border:1px solid var(--l);white-space:nowrap}nav button.on{color:#fff;border-color:var(--r)}
.b:disabled{opacity:.4;cursor:not-allowed}.b.s{background:var(--l)}.b.w{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:10px}
.bar{height:8px;background:#000a;border-radius:4px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:var(--r)}.bar i.o{background:var(--m)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:5px;border-bottom:1px solid var(--l);text-align:left}
.me{color:var(--r);font-weight:700}.sm{color:var(--m);font-size:.8rem}.big{font-family:Impact,sans-serif;font-size:2.4rem;line-height:1}
.log{height:160px;overflow:auto;background:#000;border-radius:6px;padding:8px;font:12px monospace;color:var(--m)}.log .h{color:#facc15}.log .d{color:#f87171}
select,input{background:#000;color:#fff;border:1px solid var(--l);padding:8px;border-radius:6px;width:100%;font:inherit}
.menu{max-width:420px;margin:40px auto;text-align:center}.menu .b{width:100%;margin-top:10px;padding:14px}
.fb{display:flex;align-items:center;gap:6px}.fb button{width:30px;height:30px;background:var(--l);color:#fff;border:0;border-radius:6px}
.ov{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:4px;background:#000e;border:2px solid var(--r);border-radius:14px;padding:18px 30px;font:2.2rem Impact,sans-serif;z-index:9;cursor:pointer;box-shadow:0 0 40px #e11d4866}.ov small{font:13px 'Segoe UI',Arial,sans-serif;color:var(--m)}
.md{color:var(--r);font-size:.75rem;min-height:2.2em}
.dlg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.dbox{background:var(--c);border:1px solid var(--r);border-radius:14px;padding:20px;max-width:420px;width:100%}.dbox p{white-space:pre-line;margin-bottom:10px}
.wg{display:flex;gap:8px;margin-bottom:8px}.wt{flex:1;background:#000a;border:1px solid var(--l);border-radius:10px;padding:8px;text-align:center}.wt svg{display:block;margin:4px auto}.wt .bar{margin:6px 0 0}
.av{width:54px;height:54px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font:1.6rem Impact,sans-serif}.chip{border:1px solid;border-radius:4px;padding:1px 8px;font-size:.7rem;letter-spacing:1px}
.card{overflow-x:auto}@media(max-width:600px){body{padding:6px;font-size:14px}.big{font-size:1.8rem}.menu h1{font-size:3rem!important}.b,nav button{padding:9px 10px}}
.mm{position:relative;height:26px;border-radius:13px;background:#000;border:1px solid var(--l);margin-bottom:8px;overflow:hidden}.mm i{position:absolute;top:8px;width:10px;height:10px;border-radius:50%;background:var(--m)}.mm i.p{background:var(--r);top:6px;width:14px;height:14px;z-index:2}
</style></head><body><div id="app"></div>
<script>
const $=i=>document.getElementById(i),RN=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),G=()=>(Math.random()+Math.random()+Math.random()-1.5)*2,M=n=>'$'+Math.round(n).toLocaleString('pt-BR');
const T=[{n:'Kart Regional',rep:0,rc:6,lp:10,sal:300,pit:0},{n:'Copa Formação (F4 / Turismo)',rep:20,rc:8,lp:12,sal:1500,pit:1},{n:'Aurora F3 / GT4',rep:45,rc:10,lp:14,sal:4000,pit:1},{n:'Aurora F2 / GT3 / Stock',rep:65,rc:12,lp:16,sal:12000,pit:2},{n:'Grand Prix Mundial / Hypercar',rep:85,rc:14,lp:18,sal:40000,pit:2}];
const CAP=[45,58,70,82,100],K=[1,.8,.6,.45,.3],PT=[25,18,15,12,10,8,6,4,2,1],LV=['Top','Meio de tabela','Fundo'],LR=[[0,2],[3,5],[6,9]];
const TN=['Apex Racing Syndicate','Aurora Motorsport','Vortex GP','Nova Dynamics','Ironclad Racing','Solaris Team','Phoenix Works','Blackline Racing','Zenith Speed','Titan Corsa','Helix Racing','Crimson Arrow'];
const DN=['Elias Vance','Lucas Moreau','Marco Rossi','Pedro Gómez','Kenji Arai','Anika Berg','Tomás Silva','Rafaela Duarte','Ivan Petrov','Sofia Lund','Diego Cruz','Hana Mori','Jonas Keller','Lara Costa','Omar Haddad','Nina Voss'];
const TR=['Autódromo Aurora','Circuito Sakura','Porto Sombrio','Monte Rocha','Costa Ventosa','Anel de Ferro','Vale das Chamas','Deserto Neon','Lago Prateado','Cume Gélido','Baía do Sol','Rodovia 66','Estrela Polar','Grande Final de Aurora'];
const AR={Velocista:'vel',Duelista:'ult',Estrategista:'con',Maratonista:'fis','Frio e calculista':'foc'},SK=['vel','ult','con','foc','fis'],NM={vel:'Velocidade',ult:'Ultrapassagem',con:'Consistência',foc:'Foco',fis:'Físico'};
const UP={sim:['Simulador caseiro',5000,'+2 VEL +1 CON'],per:['Personal trainer e nutricionista',12000,'+4 FIS'],coa:['Coach de telemetria',25000,'+3 ULT +2 FOC'],psi:['Psicólogo esportivo',20000,'+5 FOC, menos erros na chuva'],med:['Assessoria de imprensa',15000,'+10% de REP por vitória'],age:['Agente esportivo',18000,'+4% de poder de negociação por nível'],eng:['Engenheiro pessoal',22000,'Acelera o desenvolvimento do carro da sua equipe'],fis2:['Fisioterapeuta',10000,'Menos fadiga após cada corrida']};
const UC=[1,1.8,3.2],UE=[1,.75,.5];
const ACT={sim:['Simulador',m=>{s.st[RN(0,1)<.5?'vel':'con']+=RN(.5,1.5);s.fa+=8}],aca:['Academia',m=>{s.st.fis+=RN(.5,1.5);s.fa+=12}],tel:['Telemetria',m=>{s.st[RN(0,1)<.5?'ult':'foc']+=RN(.5,1.5);s.fa+=8}],med:['Mídia e patrocínio',m=>{s.rep+=.5;s.bank+=150*(s.t+1);s.mo+=4}],eng:['Feedback ao engenheiro',m=>{me().car+=RN(.5,1.2)*(1+.5*(s.up.eng||0));s.fa+=5;s.rel=cl((s.rel??50)+2,0,100)}],tes:['Teste de acerto',m=>{s.hint=s.rc+1;s.fa+=6}],des:['Descanso',m=>{s.fa-=25;s.mo+=5}]};
const EV=[['Um patrocinador local paga uma ação de divulgação.',()=>s.bank+=400*(s.t+1)],['A imprensa elogia sua última corrida.',()=>s.rep+=.5],['Elias Vance, seu rival desde o kart, provoca você na imprensa.',()=>s.mo-=4],['O engenheiro acha ganho no acerto do carro.',()=>s.st.con+=.5],['Rafael Duarte, seu antigo mentor, liga com uma dica de frenagem.',()=>s.st.foc+=.5],['Fãs lotam o paddock e animam a equipe.',()=>s.mo+=5],['Rumores dizem que a Meridian Corp. financia a liga inteira em segredo.',()=>0],['O simulador da equipe falha e você refaz o treino.',()=>s.fa+=5]];
const LORE='Ano 2041. A Liga Aurora nasceu depois do Grande Apagão do automobilismo, quando os campeonatos antigos faliram. Hoje cinco categorias sobem da terra do kart até o Grand Prix Mundial, e a Meridian Corp. financia tudo nos bastidores. Seu mentor, Rafael Duarte, parou de correr para treinar você. Seu rival, Elias Vance, já subiu duas categorias e promete esperar no topo.';
let s=null,V='perfil',RC=null;
const save=()=>{if(s.free)return;try{localStorage.setItem('gridlife1',JSON.stringify(s))}catch(e){}};
const cap=()=>CAP[s.t],ef=k=>{let v=Math.min(s.st[k],cap());if(k=='foc')v+=s.mo<30?-5:s.mo>80?3:0;if(k=='fis'&&s.fa>70)v-=8;return v};
function world(lv,keep){const W=[],sh=TN.slice().sort(()=>Math.random()-.5).slice(0,10),dn=DN.filter(x=>x!='Elias Vance').sort(()=>Math.random()-.5);dn.splice(Math.floor(Math.random()*10),0,'Elias Vance');
 sh.forEach((n,i)=>{const car=30+(9-i)*6.5+RN(0,5);W.push({n,car,eff:car*.9+RN(0,8),rel:45+(9-i)*5,rank:i,aff:Array.from({length:14},()=>RN(-3,3)),d:{n:dn[i],sk:25+s.t*14+(9-i)*1.5+RN(-5,5)+(dn[i]=='Elias Vance'?8:0),pts:0}})});
 const r=LR[lv],pi=Math.floor(RN(r[0],r[1]+.99));const ev=W[pi].d.n=='Elias Vance';W[pi].d={n:s.name,me:1,pts:0};W[pi].mate={n:ev?'Elias Vance':dn[10],sk:25+s.t*14+(9-pi)*1.5+RN(-5,5)+(ev?8:0),pts:0};if(keep&&s.tn){const j=W.findIndex((w,i)=>w.n==s.tn&&i!=pi);if(j>=0)W[j].n=W[pi].n;W[pi].n=s.tn}s.W=W;s.pi=pi;s.lv=lv;s.tn=W[pi].n;s.rc=0;s.slots=3;s.goal=pi<3?3:pi<6?6:8}
function newGame(name,ar,st){s={v:2,name,age:window._ag||18,st,rep:0,bank:500,mo:60,fa:0,t:0,yr:1,up:{},log:[['Bem-vindo à Liga Aurora. Sua carreira começa no kart.']],ar,disc:window._dc||'c'};world(2);save();V='perfil';draw()}
const me=()=>s.W[s.pi],tier=()=>({...T[s.t],n:TNM[s.disc||'c'][s.t]}),stand=()=>s.W.slice().sort((a,b)=>b.d.pts-a.d.pts),pos=()=>stand().findIndex(w=>w.d.me)+1;
const bar=(v,o)=>`<div class="bar"><i class="${o||''}" style="width:${cl(v,0,100)}%"></i></div>`;
function draw(){const a=$('app');ovl(0);if(s){s.mo=cl(s.mo,0,100);s.fa=cl(s.fa,0,100)}if(!s){const sv=(()=>{try{return localStorage.getItem('gridlife1')}catch(e){}})();
 a.innerHTML=`<div class="menu"><h1 style="font-size:4rem;text-shadow:0 0 30px #e11d4888">GRIDLIFE</h1><p class="sm" style="letter-spacing:3px">MOTORSPORT LIFE SIMULATION MANAGER</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px"><span class="chip">CIRCUITO</span><span class="chip">RALI</span><span class="chip">ENDURANCE</span></div><div class="card sm" style="text-align:left;margin-top:16px">${LORE}</div><button class="b" onclick="create()">Nova carreira</button><button class="b s" onclick="freeSetup()">Modo livre</button>${sv?'<button class="b s" onclick="s=mig(JSON.parse(localStorage.getItem(\'gridlife1\')));draw()">Continuar</button>':''}<button class="b s" onclick="imp()">Importar save</button><button class="b s" onclick="calib()">Calibrar simulação (teste)</button></div>`;return}
 const t=tier();a.innerHTML=`<div class="top"><h1 style="font-size:1.6rem">GRIDLIFE</h1><div class="sm">${t.n} · Ano ${s.yr} · Saldo <b style="color:var(--g)">${M(s.bank)}</b> · REP <b>${s.rep.toFixed(1)}</b></div></div><nav>${[['perfil','Perfil'],['semana','Semana'],['loja','Loja'],['camp','Campeonato'],['carro','Carro'],['neg','Negócios'],['corrida','Corrida']].map(x=>`<button class="${V==x[0]?'on':''}" onclick="V='${x[0]}';draw()">${x[1]}</button>`).join('')}<button onclick="exp()">Exportar save</button></nav><div id="v"></div>`;
 ({perfil:vPerfil,semana:vSemana,loja:vLoja,camp:vCamp,carro:vCarro,neg:vNeg,corrida:vCorrida,fim:vFim,res:vRes}[V])()}
function create(){window._ag=18;let p=10,st={vel:20,ult:20,con:20,foc:20,fis:20};$('app').innerHTML=`<div class="menu" style="max-width:520px"><h2 style="font-size:2rem">Seu piloto</h2><input id="nm" value="PILOTO" maxlength="18"><div class="row" style="justify-content:center;gap:12px;margin-top:8px"><span class="sm">Idade</span><button class="b s" onclick="ag(-1)" aria-label="Diminuir idade">▼</button><b id="agv" style="font-size:1.4rem;width:40px;text-align:center">18</b><button class="b s" onclick="ag(1)" aria-label="Aumentar idade">▲</button></div><select id="ar" style="margin-top:8px">${Object.keys(AR).map(k=>`<option>${k}</option>`).join('')}</select><select id="dc" style="margin-top:8px"><option value="c">Circuito (F4, F3, F2, F1)</option><option value="r">Rali (WRC)</option><option value="e">Endurance (WEC)</option></select><div class="card" style="margin-top:10px;text-align:left"><p>Pontos livres: <b id="pl">10</b></p>${SK.map(k=>`<div class="row fb"><span style="flex:1">${NM[k]}</span><button onclick="md('${k}',-1)">−</button><b id="s${k}" style="width:30px;text-align:center">20</b><button onclick="md('${k}',1)">+</button></div>`).join('')}</div><button class="b" onclick="go()">Começar no kart</button></div>`;
 window.md=(k,d)=>{if(d>0&&p>0){st[k]++;p--}else if(d<0&&st[k]>20){st[k]--;p++}$('s'+k).textContent=st[k];$('pl').textContent=p};
 window.go=()=>{const a=$('ar').value;st[AR[a]]+=4;window._dc=$('dc').value;newGame(($('nm').value||'PILOTO').replace(/[<>&"'`]/g,''),a,st)}}
function vPerfil(){vPerfil0();$('v').innerHTML=profHead()+$('v').innerHTML+`<div class="card"><h3>Conquistas (${(s.ach||[]).length}/${AC.length})</h3>${AC.map((a,i)=>`<p class="sm" style="${(s.ach||[]).includes(i)?'color:var(--g)':''}">${(s.ach||[]).includes(i)?'✓':'○'} <b>${a[0]}</b> · ${a[1]}</p>`).join('')}</div>`}
function vPerfil0(){const w=me(),t=tier(),po=pos();$('v').innerHTML=`<div class="g"><div class="card"><h2 style="font-size:1.8rem">${s.name}</h2><p class="sm">${s.age} anos · ${s.ar}</p><p><b>${w.n}</b></p><p class="sm">${t.n} · Meta: top ${s.goal} · Contrato: ${s.cy||1} temp.</p><hr style="border:0;border-top:1px solid var(--l);margin:10px 0"><div class="row"><span>Condição</span><b>${Math.round(100-s.fa)}%</b></div>${bar(100-s.fa,'o')}<div class="row"><span>Moral</span><b>${s.mo<30?'Baixo':s.mo>80?'Elevado':'Estável'}</b></div>${bar(s.mo)}</div>
<div class="card"><h3>Próxima corrida</h3><p class="big">${trk()}</p><p class="sm">Etapa ${s.rc+1}/${s.free||t.rc} · ${t.lp} voltas</p><p style="margin-top:8px">Posição no campeonato: <b>${po}º</b></p><button class="b w" style="margin-top:10px" onclick="V='corrida';draw()">Ir para a corrida</button></div></div>
<div class="card"><h3>Telemetria de habilidades</h3><p class="sm">Teto da categoria: ${cap()}</p>${SK.map(k=>`<div class="row"><span>${NM[k]}</span><b>${Math.round(ef(k))}/${Math.round(s.st[k])}</b></div>${bar(ef(k))}`).join('')}</div>
<div class="card"><h3>Comunicados e mídia</h3>${s.log.slice(-8).reverse().map(l=>`<p style="padding:6px 0;border-bottom:1px solid var(--l)">${l[0]}</p>`).join('')}</div>`}
function vSemana(){const n=(s.inv||{}).ep||0;$('v').innerHTML=`<div class="card"><h3>Semana de preparação</h3><div class="row"><span>Ações disponíveis</span><b style="font-size:1.4rem;letter-spacing:4px">${'●'.repeat(s.slots)}${'○'.repeat(3-s.slots)}</b></div><p class="sm">Escolha uma ação, confira o efeito e confirme. Condição: ${Math.round(100-s.fa)}% · Moral: ${Math.round(s.mo)}</p></div><div class="g">${Object.keys(ACT).map(k=>`<div class="card"><b>${ACT[k][0]}</b><p class="sm" style="margin:4px 0 8px">${ACD[k]}</p><button class="b w" ${s.slots?'':'disabled'} onclick="act('${k}')">Fazer</button></div>`).join('')}</div><div class="card"><b>Energético de preparação</b> <span class="sm">x${n} · restaura as 3 ações</span><button class="b s w" style="margin-top:8px" ${n&&s.slots<3?'':'disabled'} onclick="cu('ep')">Usar</button></div>`}
function act(k){if(!s.slots)return;dlg(ACT[k][0]+'\n'+ACD[k]+'\n\nConfirmar ação?',{c:1},()=>act2(k))}
function act2(k){if(!s.slots)return;const b={...s.st,fa:s.fa,mo:s.mo,rep:s.rep,bank:s.bank};ACT[k][1]();s.slots--;s.fa=cl(s.fa,0,100);s.mo=cl(s.mo,0,100);const d=[];SK.forEach(x=>{const v=s.st[x]-b[x];if(Math.abs(v)>.01)d.push(NM[x]+' '+(v>0?'+':'')+v.toFixed(1))});if(s.fa!=b.fa)d.push('fadiga '+(s.fa>b.fa?'+':'')+Math.round(s.fa-b.fa));if(s.mo!=b.mo)d.push('moral '+(s.mo>b.mo?'+':'')+Math.round(s.mo-b.mo));if(s.rep!=b.rep)d.push('REP +'+(s.rep-b.rep).toFixed(1));if(s.bank!=b.bank)d.push(M(s.bank-b.bank));s.log.push(['Semana · '+ACT[k][0]+': '+d.join(', ')+'.']);if(Math.random()<.35)evt();save();draw()}
function vLoja(){vLoja0();$('v').innerHTML+=`<div class="card"><h3>Consumíveis</h3><div class="g">${Object.keys(CN).map(k=>`<div><b>${CN[k][0]}</b> <span class="sm">x${(s.inv||{})[k]||0} · ${CN[k][2]}</span><div class="row" style="margin-top:6px"><button class="b" ${s.bank<CN[k][1]?'disabled':''} onclick="cb('${k}')">${M(CN[k][1])}</button><button class="b s" onclick="cu('${k}')">Usar</button></div></div>`).join('')}</div></div>`}
function vLoja0(){$('v').innerHTML=`<div class="card"><h3>Loja do salário</h3><p class="sm">Efeitos caem a cada nível. Pontos acima do teto da categoria ficam guardados até a promoção.</p></div><div class="g">${Object.keys(UP).map(k=>{const l=s.up[k]||0,c=UP[k][1]*UC[l];return`<div class="card"><b>${UP[k][0]}</b> <span class="sm">nível ${l}/3</span><p class="sm">${UP[k][2]}</p><button class="b w" style="margin-top:8px" ${l>=3||s.bank<c?'disabled':''} onclick="buy('${k}')">${l>=3?'Máximo':'Comprar '+M(c)}</button></div>`}).join('')}</div>`}
function buy(k){const l=s.up[k]||0,c=UP[k][1]*UC[l],e=UE[l];if(s.bank<c)return;s.bank-=c;s.up[k]=l+1;const S=s.st;
 if(k=='sim'){S.vel+=2*e;S.con+=e}if(k=='per')S.fis+=4*e;if(k=='coa'){S.ult+=3*e;S.foc+=2*e}if(k=='psi')S.foc+=5*e;save();draw()}
function vCamp(){vCamp0();$('v').innerHTML+=lastCard(5)+hofCard();const w=me();$('v').innerHTML+=w.mate?`<div class="card"><h3>Companheiro de equipe</h3><p>${w.mate.n}: <b>${w.mate.pts}</b> pts · Você: <b>${w.d.pts}</b> pts</p></div>`:''}
